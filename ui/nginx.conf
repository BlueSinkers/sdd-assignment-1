server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid caching config.js so deploys pick up new service URLs.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
